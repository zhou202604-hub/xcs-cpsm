<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>物料查询 - 金蝶</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <span class="logo-icon">KD</span>
            <span class="app-title">物料查询</span>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="refreshBtn" onclick="loadMaterials()" title="刷新">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 4v6h6"></path>
                    <path d="m23 20v-6h-6"></path>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"></path>
                    <path d="M3.51 15a9 9 0 0 0 14.85 3.36L23 14"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="user-info" id="userInfo" style="display:none;">
        <span class="user-badge">企业微信</span>
        <span id="userName">--</span>
    </div>

    <div class="search-bar">
        <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="输入物料名称/通用名/规格型号搜索..." oninput="onSearchInput()">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()" style="display:none;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="m15 9-6 6"></path>
                    <path d="m9 9 6 6"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" data-level="" onclick="filterByLevel(this, '')">全部</button>
        <button class="filter-tab" data-level="一级" onclick="filterByLevel(this, '一级')">一级</button>
        <button class="filter-tab" data-level="二级" onclick="filterByLevel(this, '二级')">二级</button>
        <button class="filter-tab" data-level="三级" onclick="filterByLevel(this, '三级')">三级</button>
    </div>

    <main class="content">
        <div id="materialList" class="material-list"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <p class="empty-text">未找到相关物料</p>
            <p class="empty-hint">试试其他关键词吧</p>
        </div>
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
        <div id="errorState" class="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 8v4"></path>
                <path d="M12 16h.01"></path>
            </svg>
            <p class="empty-text" id="errorTitle">连接失败</p>
            <p class="empty-hint" id="errorMessage">请检查后端服务是否正常启动</p>
        </div>
    </main>

    <div class="material-detail-modal" id="detailModal">
        <div class="detail-modal-content">
            <div class="detail-header">
                <h2 id="detailTitle">物料详情</h2>
                <button class="close-btn" onclick="closeDetail()">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18"></path>
                        <path d="m6 6 12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="detail-body" id="detailBody"></div>
        </div>
    </div>

    <div class="image-preview-modal" id="imagePreviewModal" onclick="closeImagePreview(event)">
        <div class="image-preview-content">
            <div class="image-preview-header">
                <span id="imagePreviewCount">1 / 1</span>
                <button class="image-preview-close" onclick="closeImagePreview()">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18"></path>
                        <path d="m6 6 12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="image-preview-slider" id="imagePreviewSlider"></div>
            <div class="image-preview-nav">
                <button class="image-prev-btn" id="prevImageBtn" onclick="prevImage()">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                </button>
                <button class="image-next-btn" id="nextImageBtn" onclick="nextImage()">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m9 18 6-6-6-6"></path>
                    </svg>
                </button>
            </div>
            <div class="image-preview-dots" id="imagePreviewDots"></div>
        </div>
    </div>

    <div class="bottom-safe"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
